services:
  database:
    image: postgres:16-alpine
    container_name: talentos-postgres
    restart: unless-stopped
    environment:
      environment:
  POSTGRES_USER: postgres
  POSTGRES_HOST_AUTH_METHOD: trust

    ports:
      - "5432:5432"
    volumes:
      - talentos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talentos_postgres_data:
